[project]
name = "doorstop-edit"
version = "0.1.4"
description = "Cross-platform doorstop GUI editor"
authors = [{name = "Alexander Ernfridsson", email = "ernfridsson@gmail.com"}]
license = "MIT"
readme = "README.md"
keywords = ["doorstop", "requirements-management", "documentation", "gui"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Editors :: Documentation",
    "Topic :: Text Processing :: Markup",
]
urls = { Repository = "https://github.com/ownbee/doorstop-edit.git", GitHub = "https://github.com/ownbee/doorstop-edit" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "doorstop >=3.2, <4",
    "PySide6>=6.12,<7",
    "qt-material>=2.17,<3",
    "markdown>=3.8,<4",
    "plantuml-markdown>=3.11,<4",
    "mdformat-myst>=0.2,<1",
    "pygments>=2.19,<3",
    "setuptools>=80,<81",
    "pyspellchecker>=0.8,<1",
    "watchdog>=7,<8",
]

[dependency-groups]
dev = [
    # Linters
    "mypy>=1.18,<2",
    "ruff>=0.14,<1",
    # Testing
    "pytest>=8.4,<10",
    "pytest-qt>=4.5,<5",
    "pytest-cov>=6,<8",
    # Tooling
    "colorama>=0.4.6,<0.5.0",
    # Typing
    "types-requests>=2.32,<3",
    "types-markdown>=3.10,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["doorstop_edit"]
exclude = ["**/test/**", "**/tests/**", "**/conftest.py"]

[tool.hatch.build.targets.sdist]
include = ["doorstop_edit", "ui", "tools", "README.md", "LICENSE"]
exclude = ["**/test/**", "**/tests/**", "**/conftest.py"]

[tool.hatch.build]
# Include generated package files even though they are ignored by Git.
artifacts = ["doorstop_edit/ui_gen/*.py", "doorstop_edit/build_info.py"]

[tool.uv]
package = true


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
extend-ignore = ["E203"]
fixable = ["F401", "F841", "I"]

[tool.mypy]
follow_imports = 'normal'
ignore_missing_imports = true # Ignore since not all third-party use typing.
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "doorstop_edit.ui_gen.*"  # Generated directory.
follow_imports = 'silent'

[project.scripts]
doorstop-edit = 'doorstop_edit.main:main'

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
