name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  tests:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [Ubuntu, macOS, Windows]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: Ubuntu
            image: ubuntu-22.04
          - os: Windows
            image: windows-2022
          - os: macOS
            image: macos-15
      fail-fast: false
    env:
      DISPLAY: :99.0
      QT_DEBUG_PLUGINS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Ubuntu Qt dependencies
        if: ${{ matrix.os == 'Ubuntu' }}
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libglib2.0-0 libgles2-mesa-dev libdbus-1-3 libxkbcommon-x11-0 libxkbfile1 libnss3 libxcomposite1 libxdamage1 libxrender1 libxrandr2 libxtst6 libxi6 libasound2
          version: 1.0

      - name: Install Ubuntu xvfb dependencies
        if: ${{ matrix.os == 'Ubuntu' }}
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libxcb-cursor0
          version: 1.0

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check lock file
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      - name: Build resources
        run: uv run --no-sync python build.py

      - name: Code check
        run: uv run --no-sync python tools/check_code.py

      - name: Run tests (Ubuntu)
        if: ${{ matrix.os == 'Ubuntu' }}
        run: xvfb-run uv run --no-sync pytest -ra --color=yes --cov=doorstop_edit --cov-report=xml

      - name: Run tests (other)
        if: ${{ matrix.os != 'Ubuntu' }}
        run: uv run --no-sync pytest -ra -s --color=yes --cov=doorstop_edit --cov-report=xml

      - uses: codecov/codecov-action@v4
        if: ${{ matrix.os == 'Ubuntu' && matrix.python-version == '3.11' && github.repository == 'ownbee/doorstop-edit' }}
        continue-on-error: true
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
